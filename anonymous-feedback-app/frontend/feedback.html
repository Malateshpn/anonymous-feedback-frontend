<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Anonymous Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6 border border-gray-100">
        <!-- Header Section -->
        <h1 id="box-title" class="text-2xl font-bold text-gray-900 mb-2">Loading...</h1>
        <p id="box-description" class="text-sm text-gray-500 mb-6">Fetching details for this feedback box...</p>

        <!-- Form Section -->
        <form id="feedback-form" class="space-y-4">
            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Your Anonymous Message</label>
                <textarea 
                    id="message" 
                    rows="5" 
                    required 
                    placeholder="Write your honest feedback here... (No identity will be recorded)" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                ></textarea>
            </div>

            <button 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition duration-150"
            >
                Submit Anonymous Feedback
            </button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const boxCode = urlParams.get('code');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!boxCode) {
                alert('Invalid or missing feedback code URL!');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/boxes/code/${boxCode}`);
                if (response.ok) {
                    const box = await response.json();
                    document.getElementById('box-title').textContent = box.title;
                    document.getElementById('box-description').textContent = box.description || 'Leave your honest thoughts anonymously below.';
                } else {
                    document.getElementById('box-title').textContent = 'Box Not Found';
                    document.getElementById('box-description').textContent = 'The requested feedback box code is invalid or has been deleted.';
                }
            } catch (err) {
                console.error('Error loading box:', err);
                alert('Could not connect to the server!');
            }
        });

        document.getElementById('feedback-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = document.getElementById('message').value;

            try {
                const response = await fetch(`${API_BASE_URL}/responses/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: boxCode, message: message })
                });

                if (response.ok) {
                    alert('Your anonymous feedback has been submitted successfully!');
                    document.getElementById('message').value = '';
                } else {
                    const errorMsg = await response.text();
                    alert(errorMsg);
                }
            } catch (err) {
                console.error('Submission error:', err);
                alert('Failed to submit feedback!');
            }
        });
    </script>
    
</body>
</html>
