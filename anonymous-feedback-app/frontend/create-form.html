<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Box - FeedbackBox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white border-b border-gray-200 px-6 py-4">
        <a href="dashboard.html" class="text-sm text-blue-600 hover:underline">← Back to Dashboard</a>
    </nav>

    <div class="max-w-lg mx-auto mt-10 px-4">
        <div class="bg-white rounded-xl shadow-md p-8 border border-gray-100">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Create a Feedback Box</h1>
            <p class="text-sm text-gray-500 mb-6">Set up a new topic or purpose for receiving anonymous messages.</p>

            <form onsubmit="event.preventDefault();">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Title / Topic</label>
                    <input type="text" id="title" required placeholder="e.g. Placement Training Feedback" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Instructions / Description</label>
                    <textarea id="description" rows="3" placeholder="e.g. Share honest thoughts on aptitude sessions..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
                    Generate Box & Public Link
                </button>
            </form>
        </div>
    </div>

<script src="js/api.js"></script>
<script>
  const createForm = document.querySelector('form');

  createForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const currentUser = JSON.parse(localStorage.getItem('user'));
    if (!currentUser) {
      alert('Please log in first!');
      window.location.href = 'login.html';
      return;
    }

    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;

    try {
      const response = await fetch(`${API_BASE_URL}/boxes/create`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: title,
          description: description,
          userId: currentUser.id.toString()
        })
      });

      if (response.ok) {
        const box = await response.json();
        alert(`Feedback box created successfully! Code: ${box.code}`);
        window.location.href = 'dashboard.html';
      } else {
        const errorText = await response.text();
        alert(errorText);
      }
    } catch (err) {
      console.error('Error creating feedback box:', err);
      alert('Could not connect to backend server!');
    }
  });
</script>

</body>
</html>
