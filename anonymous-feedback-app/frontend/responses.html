<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Received Feedback - FeedbackBox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <main class="max-w-4xl mx-auto py-10 px-4">
        <!-- Top Bar -->
        <div class="flex justify-between items-center mb-8">
            <a href="dashboard.html" class="text-sm font-medium text-blue-600 hover:underline">
                ← Back to Dashboard
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Received Feedback Responses</h1>
        </div>

        <!-- Responses Container -->
        <div id="responses-container" class="space-y-4">
            <p class="text-gray-500 text-sm">Loading responses...</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const boxId = urlParams.get('boxId');

        document.addEventListener('DOMContentLoaded', () => {
            if (!boxId) {
                alert('No box selected!');
                window.location.href = 'dashboard.html';
                return;
            }
            loadResponses();
        });

        async function loadResponses() {
            const container = document.getElementById('responses-container');

            try {
                const res = await fetch(`${API_BASE_URL}/responses/box/${boxId}`);
                if (!res.ok) throw new Error('Failed to load responses');

                const responses = await res.json();
                container.innerHTML = '';

                if (responses.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white p-6 rounded-xl border border-gray-200 text-center text-gray-500">
                            No responses received yet for this feedback box.
                        </div>
                    `;
                    return;
                }

                responses.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-sm p-6 border border-gray-200 relative';

                    const formattedDate = item.createdAt 
                        ? new Date(item.createdAt).toLocaleString() 
                        : 'Unknown Date';

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <p class="text-gray-800 text-base font-normal pr-8">${item.message}</p>
                            <button onclick="deleteResponse(${item.id})" class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs rounded-md font-medium transition flex items-center space-x-1 shrink-0">
                                <span>🗑️ Delete</span>
                            </button>
                        </div>
                        <div class="flex justify-between items-center text-xs text-gray-400 pt-2 border-t border-gray-100">
                            <span>Anonymous Submission</span>
                            <span>${formattedDate}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error fetching responses:', err);
                container.innerHTML = `<p class="text-red-500 text-sm">Could not load responses. Ensure the backend is running.</p>`;
            }
        }

        async function deleteResponse(responseId) {
            if (!confirm('Are you sure you want to delete this response?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/responses/${responseId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadResponses();
                } else {
                    alert('Failed to delete response.');
                }
            } catch (err) {
                console.error('Error deleting response:', err);
                alert('Error connecting to backend server.');
            }
        }
    </script>
</body>
</html>
